version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: infralytix-postgres
    restart: always
    environment:
      POSTGRES_USER: infralytix_user
      POSTGRES_PASSWORD: infralytix_password_2026
      POSTGRES_DB: infralytix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infralytix_user -d infralytix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infralytix-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    container_name: infralytix-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://infralytix_user:infralytix_password_2026@db:5432/infralytix_db
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: "True"
      SECRET_KEY: "infralytix-production-jwt-key-2026"
      ENVIRONMENT: "production"
      DEBUG: "False"
    ports:
      - "8000:8000"
    command: >
      sh -c "python backend/seed_data.py &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 4"

volumes:
  postgres_data:
